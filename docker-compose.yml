name: better-t-stack-template

# Production-shaped stack (generated by Better-T-Stack `--web-deploy docker`,
# extended with a one-shot `migrate` service).
#
#   apps/web/.env  production app config (BETTER_AUTH_SECRET, BETTER_AUTH_URL, ...)
#                  used as BuildKit secret at build time and env_file at runtime
#   .env (root)    compose variables: POSTGRES_PASSWORD, WEB_PORT
#
# bun run docker:up    build + start (postgres → migrate → web)
# bun run db:start     only postgres, for local development

x-web-image: &web-image
  image: better-t-stack-template-web
  build:
    context: .
    dockerfile: apps/web/Dockerfile
    secrets:
      - web_env

services:
  web:
    <<: *web-image
    init: true
    ports:
      # Bound to localhost: put a reverse proxy (Caddy/nginx) with TLS in front.
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/better-t-stack-template
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/auth/ok').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Applies Drizzle migrations (packages/db/src/migrations) and exits.
  migrate:
    <<: *web-image
    working_dir: /app/packages/db
    command: ["node", "node_modules/drizzle-kit/bin.cjs", "migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/better-t-stack-template
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18
    container_name: better-t-stack-template-postgres
    environment:
      POSTGRES_DB: better-t-stack-template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      # Localhost only (local dev uses `bun run db:start`); never expose publicly.
      - "127.0.0.1:5432:5432"
    volumes:
      - better-t-stack-template_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  better-t-stack-template_postgres_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
